# Environment & Secrets Manifest for Hyperswitch E-Commerce Platform

hyperswitch-server:
  - DATABASE_URL
  - REDIS_URL
  - RUN_ENV
  - CONFIG_DIR
  - RUST_LOG
  - JWT_SECRET

hyperswitch-scheduler:
  - DATABASE_URL
  - REDIS_URL
  - RUN_ENV
  - CONFIG_DIR
  - SCHEDULER_FLOW # (set to 'producer' or 'consumer')
  - RUST_LOG

hyperswitch-drainer:
  - DATABASE_URL
  - REDIS_URL
  - RUN_ENV
  - CONFIG_DIR
  - RUST_LOG

hyperswitch-control-center:
  - ENV_BACKEND_URL
  - ENABLE_LOGGING
  - SDK_ENV

hyperswitch-web:
  - HYPERSWITCH_PUBLISHABLE_KEY
  - HYPERSWITCH_CLIENT_URL
  - HYPERSWITCH_SERVER_URL

order-service:
  - ORDER_DB_URL
  - HYPERSWITCH_API_KEY
  - SNS_PAYMENT_SUCCESS_TOPIC_ARN
  - PORT

inventory-service:
  - SQS_INVENTORY_QUEUE_URL
  - PORT

notification-service:
  - SQS_NOTIFICATION_QUEUE_URL
  - SMTP_SERVER
  - SMTP_PORT
  - SMTP_USERNAME
  - SMTP_PASSWORD
  - PORT

ecommerce-frontend:
  - REACT_APP_HYPERSWITCH_PUBLISHABLE_KEY
  - REACT_APP_ORDER_SERVICE_URL

postgres-db:
  - POSTGRES_USER
  - POSTGRES_PASSWORD
  - POSTGRES_DB

redis-cache:
  - REDIS_PASSWORD # (if auth is enabled)
