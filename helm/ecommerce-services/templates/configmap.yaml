apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  labels:
    {{- include "ecommerce-services.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.global.environment | quote }}
  AWS_REGION: {{ .Values.global.awsRegion | quote }}
  HYPERSWITCH_SERVER_URL: {{ .Values.global.hyperswitchServerUrl | quote }}
  HYPERSWITCH_API_KEY: {{ .Values.global.hyperswitchApiKey | quote }}
  INVENTORY_SERVICE_URL: "http://inventory-service:8001"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8002"
