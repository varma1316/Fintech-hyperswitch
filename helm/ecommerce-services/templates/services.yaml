{{/* Macro to render a standard Microservice Deployment & Service */}}
{{- $root := . -}}

{{- range $svcName, $svcConfig := dict "auth-service" .Values.authService "product-service" .Values.productService "cart-service" .Values.cartService "order-service" .Values.orderService "inventory-service" .Values.inventoryService "notification-service" .Values.notificationService }}
{{- if $svcConfig.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $svcName }}
  labels:
    app: {{ $svcName }}
    {{- include "ecommerce-services.labels" $root | nindent 4 }}
spec:
  replicas: {{ $svcConfig.replicaCount }}
  selector:
    matchLabels:
      app: {{ $svcName }}
  template:
    metadata:
      labels:
        app: {{ $svcName }}
    spec:
      containers:
        - name: {{ $svcName }}
          image: "{{ $svcConfig.image.repository }}:{{ $svcConfig.image.tag }}"
          imagePullPolicy: {{ $svcConfig.image.pullPolicy }}
          ports:
            - containerPort: {{ $svcConfig.service.port }}
          envFrom:
            - configMapRef:
                name: ecommerce-config
          {{- if $svcConfig.env }}
          env:
            {{- range $key, $val := $svcConfig.env }}
            - name: {{ $key | snakecase | upper }}
              value: {{ $val | quote }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml $svcConfig.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ $svcConfig.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $svcConfig.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $svcName }}
  labels:
    app: {{ $svcName }}
    {{- include "ecommerce-services.labels" $root | nindent 4 }}
spec:
  type: {{ $svcConfig.service.type }}
  ports:
    - port: {{ $svcConfig.service.port }}
      targetPort: {{ $svcConfig.service.port }}
      protocol: TCP
      name: http
  selector:
    app: {{ $svcName }}
{{- end }}
{{- end }}
